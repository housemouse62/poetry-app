
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    init: true
    command: sleep infinity
    working_dir: /workspaces/poetry-app
    volumes:
      - ..:/workspaces/poetry-app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://poetry:poetry_dev@postgres:5432/poetry_dev
      TEST_DATABASE_URL: postgresql://poetry:poetry_dev@postgres:5432/poetry_test
      PORT: "3000"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: poetry_dev
      POSTGRES_USER: poetry
      POSTGRES_PASSWORD: poetry_dev
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poetry -d poetry_dev"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
